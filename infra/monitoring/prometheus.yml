global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'urbanflow-monitor'
    environment: 'development'

# alertes (règles dans des fichiers séparés)
rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # En prod: alertmanager:9093

# targets de scraping
scrape_configs:

  # API FastAPI — métriques Prometheus custom
  - job_name: 'urbanflow-api'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL — pg_exporter
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis — redis_exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # Node exporter (métriques système des conteneurs)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
